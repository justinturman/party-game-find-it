    <polygon points="55,0 100,-30 100,30" fill="#fb8c00"/>
    <circle cx="-35" cy="-8" r="7" fill="#ffffff"/>
    <circle cx="-33" cy="-8" r="3" fill="#000000"/>
  </g>
  <!-- Pink flower (1420, 700) -->
  <g transform="translate(1420 700)" fill="#ec407a">
    <circle cx="38" cy="0" r="26"/><circle cx="19" cy="32.9" r="26"/><circle cx="-19" cy="32.9" r="26"/>
    <circle cx="-38" cy="0" r="26"/><circle cx="-19" cy="-32.9" r="26"/><circle cx="19" cy="-32.9" r="26"/>
