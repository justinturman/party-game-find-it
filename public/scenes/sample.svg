    <circle cx="1480" cy="100" r="45"/>
    <circle cx="640" cy="280" r="42"/>
    <rect x="830" y="345" width="100" height="70" rx="8"/>
    <circle cx="1250" cy="380" r="36"/>
    <rect x="55" y="375" width="70" height="90" rx="8"/>
  </g>
  <g fill="#78909c">
    <rect x="1135" y="45" width="90" height="50" rx="8"/>
    <circle cx="330" cy="430" r="30"/>
    <rect x="655" y="490" width="90" height="60" rx="8"/>
    <circle cx="880" cy="610" r="48"/>
    <rect x="1260" y="520" width="80" height="80" rx="8"/>
    <circle cx="1520" cy="480" r="40"/>
    <rect x="60" y="615" width="100" height="50" rx="8"/>
