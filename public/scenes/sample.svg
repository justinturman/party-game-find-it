  </g>

  <!-- Red balloon (260, 220) -->
  <g transform="translate(260 220)">
    <ellipse rx="55" ry="70" fill="#e53935"/>
    <polygon points="-8,70 8,70 0,84" fill="#e53935"/>
    <path d="M0 84 Q-14 130 -6 160" stroke="#555555" stroke-width="3" fill="none"/>
  </g>
  <!-- Yellow star (820, 150) -->
  <g transform="translate(820 150)">
    <polygon points="0,-70 16.5,-22.7 66.6,-21.6 26.6,8.7 41.1,56.6 0,28 -41.1,56.6 -26.6,8.7 -66.6,-21.6 -16.5,-22.7"
             fill="#fdd835" stroke="#f9a825" stroke-width="4"/>
  </g>
  <!-- Blue house (1340, 230) -->
  <g transform="translate(1340 230)">
    <rect x="-55" y="-5" width="110" height="75" fill="#1e66d0"/>
    <polygon points="-70,-5 0,-65 70,-5" fill="#0d3b82"/>
    <rect x="-12" y="25" width="24" height="45" fill="#f5f5f5"/>
