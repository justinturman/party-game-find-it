    <polygon points="-60,30 0,-70 60,30" fill="#2e9d46"/>
  </g>
  <!-- Purple heart (1100, 480) -->
  <g transform="translate(1100 480)">
    <path d="M0 40 C -70 -10 -45 -60 0 -25 C 45 -60 70 -10 0 40 Z" fill="#8e24aa"/>
  </g>
